<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>灵感板</title>
<style>
*{box-sizing:border-box}
html{background:#070708}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;background:radial-gradient(circle at top,#1b1b20 0,#0b0b0d 45%,#070708 100%);color:#f4f4f5}
header{position:sticky;top:0;z-index:5;padding:14px 18px 12px;background:rgba(10,10,12,.86);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.08)}
h1{margin:0;font-size:18px;font-weight:650;letter-spacing:.04em}
.sub{margin-top:4px;font-size:12px;color:#a1a1aa}
main{padding:14px 10px 34px}
.grid{column-count:2;column-gap:10px;max-width:1480px;margin:0 auto}
.card{display:inline-block;width:100%;margin:0 0 10px;border-radius:16px;overflow:hidden;background:#151518;border:1px solid rgba(255,255,255,.08);box-shadow:0 10px 28px rgba(0,0,0,.28);cursor:zoom-in;break-inside:avoid;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;position:relative}
.card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.18);box-shadow:0 16px 38px rgba(0,0,0,.38)}
.card img{display:block;width:100%;height:auto;background:#101013}
.badge{position:absolute;left:8px;top:8px;z-index:2;padding:3px 8px;border-radius:999px;background:rgba(0,0,0,.58);color:#f4f4f5;font-size:11px;line-height:1.4;backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12)}
.empty{max-width:680px;margin:40px auto;padding:22px;border:1px solid rgba(255,255,255,.1);border-radius:18px;background:rgba(255,255,255,.04);color:#d4d4d8;font-size:14px;line-height:1.8}
.lightbox{display:none;position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.93);align-items:center;justify-content:center;padding:18px;cursor:zoom-out}
.lightbox.show{display:flex}
.lightbox img{max-width:100%;max-height:92vh;width:auto;height:auto;object-fit:contain;border-radius:14px;box-shadow:0 18px 60px rgba(0,0,0,.7)}
.hint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:21;color:#d4d4d8;font-size:12px;background:rgba(255,255,255,.12);padding:7px 10px;border-radius:999px;display:none;pointer-events:none}
.lightbox.show + .hint{display:block}
@media (min-width:640px){main{padding:18px}.grid{column-count:3;column-gap:14px}.card{margin-bottom:14px;border-radius:18px}}
@media (min-width:960px){.grid{column-count:4;column-gap:16px}.card{margin-bottom:16px}}
@media (min-width:1280px){.grid{column-count:5;column-gap:18px}.card{margin-bottom:18px}}
@media (max-width:420px){main{padding-left:8px;padding-right:8px}.grid{column-gap:8px}.card{margin-bottom:8px;border-radius:14px}}
</style>
</head>
<body>
<header>
  <h1>灵感板</h1>
  <div class="sub"><span id="countText">正在加载图片…</span> · 点击图片放大预览</div>
</header>

<main>
  <section id="grid" class="grid"></section>
  <div id="empty" class="empty" style="display:none">
    没找到图片。请确认图片放在 <b>assets/</b> 文件夹下，并按 <b>image_001.jpg</b>、<b>image_002.jpg</b> 这种格式命名。对，网页也要靠命名吃饭，文明真脆弱。
  </div>
</main>

<div id="lightbox" class="lightbox" onclick="closeLightbox()"><img id="lightboxImg" alt="preview"></div>
<div class="hint">点击任意位置关闭</div>

<script>
const IMAGE_FOLDER = 'assets/';
const MAX_IMAGES = 999;
const EXTENSIONS = ['jpg', 'jpeg', 'png', 'webp'];

const grid = document.getElementById('grid');
const countText = document.getElementById('countText');
const empty = document.getElementById('empty');

function pad(num){
  return String(num).padStart(3, '0');
}

function imageExists(src){
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => resolve(src);
    img.onerror = () => resolve(null);
    img.src = src + '?v=' + Date.now();
  });
}

async function findImageForNumber(num){
  const n = pad(num);
  for (const ext of EXTENSIONS){
    const src = `${IMAGE_FOLDER}image_${n}.${ext}`;
    const ok = await imageExists(src);
    if (ok) return src;
  }
  return null;
}

function createCard(src, index){
  const figure = document.createElement('figure');
  figure.className = 'card';

  const badge = document.createElement('div');
  badge.className = 'badge';
  badge.textContent = `#${pad(index)}`;

  const img = document.createElement('img');
  img.loading = 'lazy';
  img.src = src;
  img.alt = `灵感图 ${index}`;
  img.onclick = () => openLightbox(src);

  figure.appendChild(badge);
  figure.appendChild(img);
  grid.appendChild(figure);
}

async function loadGallery(){
  let count = 0;
  for (let i = 1; i <= MAX_IMAGES; i++){
    const src = await findImageForNumber(i);
    if (src){
      count += 1;
      createCard(src, i);
      countText.textContent = `共 ${count} 张`;
    }
  }
  if (count === 0){
    countText.textContent = '未找到图片';
    empty.style.display = 'block';
  } else {
    countText.textContent = `共 ${count} 张`;
  }
}

function openLightbox(src){
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('show');
  document.body.style.overflow = '';
}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeLightbox();});

loadGallery();
</script>
</body>
</html>
